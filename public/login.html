<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log in · Pofak Stream</title>
  <meta name="theme-color" content="#14121d">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home login-page">
  <header>
    <img class="hero" src="img/logo-600.webp" srcset="img/logo-600.webp 600w, img/logo-1000.webp 1000w"
         sizes="(max-width: 640px) 92vw, 560px" width="600" height="384" alt="Pofak Stream" fetchpriority="high">
    <form id="login-form" class="login-card">
      <label>Username
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Password
        <span class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="show-pw" class="btn-ghost" type="button" aria-label="Show password">Show</button>
        </span>
      </label>
      <p id="login-error" role="alert"></p>
      <button class="btn-primary" type="submit">Log in</button>
    </form>
  </header>
  <script src="login.js" defer></script>
</body>
</html>
